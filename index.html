<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Don't be shy, come pawty with Vitty</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #glitter-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 10% 15%, rgba(255,182,210,0.85) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 10%, rgba(220,120,160,0.7) 0%, transparent 55%),
        radial-gradient(ellipse 70% 40% at 55% 40%, rgba(255,210,230,0.6) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 20% 70%, rgba(200,90,140,0.65) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 60%, rgba(255,160,200,0.7) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 40% 85%, rgba(230,100,150,0.6) 0%, transparent 55%),
        radial-gradient(ellipse 40% 50% at 70% 90%, rgba(255,190,220,0.75) 0%, transparent 55%),
        #f4a0c0;
      filter: blur(18px) saturate(0.85) brightness(1.08);
      transform: scale(1.05);
      z-index: 0;
    }

    #glitter { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    #cena-wrap {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #cena-img {
      height: 88vh;
      width: auto;
      max-width: 90vw;
      object-fit: contain;
      object-position: center top;
      filter: brightness(0.92) saturate(1.1);
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    }

    @media (max-width: 600px) {
      #cena-img {
        height: auto;
        width: 100vw;
        max-width: 100vw;
      }
      #cena-wrap {
        align-items: flex-start;
        padding-top: 8vh;
      }
    }

    #floaties { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

    /* TOP — "Don't be shy," centered */
    .top-text {
      position: fixed;
      top: 2rem;
      left: 0;
      right: 0;
      z-index: 5;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.7s 0.3s ease forwards;
    }

    .top-text .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(0.5rem, 1.2vw, 0.75rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }

    .top-text h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 7.5vw, 6.5rem);
      line-height: 0.95;
      color: #111;
      text-shadow:
        0 0 25px rgba(255, 61, 139, 1),
        0 0 55px rgba(255, 61, 139, 0.85),
        0 0 90px rgba(255, 61, 139, 0.5);
    }

    /* BOTTOM — "come pawty with Vitty." centered */
    .bottom-text {
      position: fixed;
      bottom: 2.5rem;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.6s ease forwards;
    }

    .bottom-text h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 7.5vw, 6.5rem);
      line-height: 0.95;
      color: #111;
      text-align: center;
      text-shadow:
        0 0 25px rgba(255, 61, 139, 1),
        0 0 55px rgba(255, 61, 139, 0.85),
        0 0 90px rgba(255, 61, 139, 0.5);
    }

    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      color: #fff;
      text-shadow: 1px 1px 8px rgba(0,0,0,0.6);
    }

    .cta {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.3rem);
      letter-spacing: 0.12em;
      color: #000;
      background: #ffe93c;
      padding: 0.65em 2.2em;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 30px rgba(255,233,60,0.5), 4px 4px 0 #ff3d8b;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 0.2rem;
    }

    .cta:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 40px rgba(255,233,60,0.7), 6px 6px 0 #ff3d8b;
    }

    /* MIDDLE — invite button floating in the blue gap */
    .mid-cta {
      position: fixed;
      bottom: 38%;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.7s 0.9s ease forwards;
    }

    .cta-invite {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      letter-spacing: 0.05em;
      color: #c2006a;
      background: #fff0f5;
      padding: 0.65em 2em;
      border-radius: 999px;
      text-decoration: none;
      border: 2.5px solid #ffb6d9;
      box-shadow:
        0 0 0 4px rgba(255,182,217,0.3),
        4px 4px 0 #ffb6d9,
        inset 0 1px 0 rgba(255,255,255,0.9);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .cta-invite::before {
      content: '🎀';
      margin-right: 0.4em;
      font-size: 1em;
    }

    .cta-invite::after {
      content: '🎀';
      margin-left: 0.4em;
      font-size: 1em;
    }

    .cta-invite:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 0 0 4px rgba(255,182,217,0.5), 6px 6px 0 #ffb6d9, inset 0 1px 0 rgba(255,255,255,0.9);
    }

    #music-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      background: #ff3d8b;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.8rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(255,61,139,0.6), 3px 3px 0 #111;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: pulse 2s ease-in-out infinite;
    }

    #music-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(255,61,139,0.8), 3px 3px 0 #111;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="glitter-bg"></div>
<canvas id="glitter"></canvas>

<div id="cena-wrap">
  <img id="cena-img" src="image.png" alt="John Cena" />
</div>

<canvas id="floaties"></canvas>

<!-- TOP centered -->
<div class="top-text">
  <p class="eyebrow">✨ you are cordially summoned ✨</p>
  <h1>Don't be shy,</h1>
</div>

<!-- MIDDLE — invite button in the blue gap above bottom text -->
<div class="mid-cta">
  <a class="cta-invite" href="https://partiful.com/e/31PxJnNpnkCRsArT4Dp6?c=cFAXTaDo" target="_blank">
    View the Invite ✨
  </a>
</div>

<!-- BOTTOM centered -->
<div class="bottom-text">
  <h2>come pawty wit Vitty.</h2>
  <p class="tagline">it's giving birthday energy 💅</p>
</div>

<button id="music-btn" onclick="toggleMusic()">
  <span id="music-icon">🔇</span>
  <span id="music-label">click here to play a bad lil vibe</span>
</button>

<audio id="audio" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  // ── Glitter sparkles ──────────────────────────────────────
  const gc = document.getElementById('glitter');
  const gx = gc.getContext('2d');
  gc.width = window.innerWidth;
  gc.height = window.innerHeight;

  const sparks = Array.from({length: 200}, () => ({
    x: Math.random() * gc.width,
    y: Math.random() * gc.height,
    r: Math.random() * 2.8 + 0.4,
    a: Math.random(),
    da: (Math.random() * 0.018 + 0.004) * (Math.random() > 0.5 ? 1 : -1),
    c: ['#ffffff','#ffb6d9','#ff3d8b','#ffd6e8','#ff80b5','#ffe4f0'][Math.floor(Math.random()*6)]
  }));

  (function glitterLoop() {
    gx.clearRect(0, 0, gc.width, gc.height);
    sparks.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      gx.beginPath();
      gx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      gx.fillStyle = s.c;
      gx.globalAlpha = Math.max(0, Math.min(1, s.a));
      gx.fill();
    });
    gx.globalAlpha = 1;
    requestAnimationFrame(glitterLoop);
  })();

  // ── Floating kiss emoji ───────────────────────────────────
  const fc = document.getElementById('floaties');
  const fx = fc.getContext('2d');
  fc.width = window.innerWidth;
  fc.height = window.innerHeight;

  const emojiImg = new Image();
  emojiImg.src = 'floatie2.png';

  const floaties = Array.from({length: 25}, () => ({
    x: Math.random() * fc.width,
    y: Math.random() * fc.height,
    size: Math.random() * 45 + 25,
    vy: Math.random() * 0.7 + 0.25,
    vx: (Math.random() - 0.5) * 0.5,
    ang: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.012,
    a: Math.random() * 0.35 + 0.65
  }));

  (function floatLoop() {
    fx.clearRect(0, 0, fc.width, fc.height);
    if (emojiImg.complete && emojiImg.naturalWidth > 0) {
      floaties.forEach(p => {
        p.y += p.vy; p.x += p.vx; p.ang += p.spin;
        if (p.y > fc.height + p.size) { p.y = -p.size; p.x = Math.random() * fc.width; }
        fx.save();
        fx.globalAlpha = p.a;
        fx.translate(p.x, p.y);
        fx.rotate(p.ang);
        fx.drawImage(emojiImg, -p.size/2, -p.size/2, p.size, p.size);
        fx.restore();
      });
    }
    requestAnimationFrame(floatLoop);
  })();

  window.addEventListener('resize', () => {
    gc.width = fc.width = window.innerWidth;
    gc.height = fc.height = window.innerHeight;
  });

  // ── Music ─────────────────────────────────────────────────
  let playing = false;
  const audio = document.getElementById('audio');
  const icon  = document.getElementById('music-icon');
  const label = document.getElementById('music-label');

  function toggleMusic() {
    if (!playing) {
      audio.currentTime = 19;
      audio.play().then(() => {
        icon.textContent  = '🔊';
        label.textContent = 'Vibing...';
        playing = true;
      }).catch(() => {
        label.textContent = 'Add song.mp3!';
      });
    } else {
      audio.pause();
      icon.textContent  = '🔇';
      label.textContent = 'click here to play a bad lil vibe';
      playing = false;
    }
  }
</script>
</body>
</html>
