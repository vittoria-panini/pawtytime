<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Don't be shy, come pawty wif Vitty and fwends</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #ff3d8b;
      --yellow: #ffe93c;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Aqua glitter background */
    #glitter-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, #00fff7 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, #0077ff 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #00c8e0 0%, transparent 70%),
        #00b4d8;
      z-index: 0;
    }

    /* Glitter sparkle canvas */
    #glitter { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* John Cena — centered, contained */
    #cena-wrap {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #cena-img {
      height: 85vh;
      width: auto;
      max-width: 65vw;
      object-fit: contain;
      object-position: center top;
      filter: brightness(0.9) saturate(1.1);
      -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
    }

    /* Floating emoji canvas */
    #floaties { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

    /* Main content pinned to bottom */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 0 2rem 2.5rem;
      gap: 0.6rem;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(0.6rem, 1.6vw, 0.85rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--yellow);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fadeUp 0.7s 0.2s ease forwards;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 9vw, 7rem);
      line-height: 0.94;
      color: #fff;
      text-shadow: 0 0 50px rgba(255,61,139,0.8), 3px 3px 0 var(--pink);
      opacity: 0;
      animation: fadeUp 0.7s 0.45s ease forwards;
    }

    h1 span { color: var(--pink); }

    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(0.95rem, 2.5vw, 1.5rem);
      color: #fff;
      text-shadow: 1px 1px 8px rgba(0,0,0,0.6);
      opacity: 0;
      animation: fadeUp 0.7s 0.7s ease forwards;
    }

    .cta-wrap {
      margin-top: 0.4rem;
      opacity: 0;
      animation: fadeUp 0.7s 1s ease forwards;
    }

    .cta {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      letter-spacing: 0.12em;
      color: #000;
      background: var(--yellow);
      padding: 0.7em 2.4em;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 30px rgba(255,233,60,0.5), 4px 4px 0 var(--pink);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .cta:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 40px rgba(255,233,60,0.7), 6px 6px 0 var(--pink);
    }

    .cta:active { transform: scale(0.97); }

    #music-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s;
    }

    #music-btn:hover { background: rgba(255,255,255,0.28); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="glitter-bg"></div>
<canvas id="glitter"></canvas>

<div id="cena-wrap">
  <img id="cena-img" src="image.png" alt="John Cena" />
</div>

<canvas id="floaties"></canvas>

<div class="stage">
  <p class="eyebrow">✨ you are cordially summoned ✨</p>
  <h1>Don't be shy,<br>come <span>pawty</span><br>wif Vitty and fwends</h1>
  <p class="tagline">it's giving birthday energy</p>
  <div class="cta-wrap">
    <a class="cta" href="https://partiful.com/create?referrer=landing&highlight=plus_ones&toggledSetting=ticketing" target="_blank">
      View the Invite →
    </a>
  </div>
</div>

<button id="music-btn" onclick="toggleMusic()">
  <span id="music-icon">🔇</span>
  <span id="music-label">Play the vibe</span>
</button>

<iframe id="yt" src="" style="display:none" allow="autoplay"></iframe>

<script>
  // ── Aqua glitter sparkles ─────────────────────────────────
  const gc = document.getElementById('glitter');
  const gx = gc.getContext('2d');

  function resizeCanvases() {
    gc.width  = fc.width  = window.innerWidth;
    gc.height = fc.height = window.innerHeight;
  }

  const sparks = Array.from({length: 200}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 2.8 + 0.4,
    a: Math.random(),
    da: (Math.random() * 0.018 + 0.004) * (Math.random() > 0.5 ? 1 : -1),
    c: ['#ffffff','#00fff7','#ffe93c','#ff3d8b','#b2ffff','#aaffee'][Math.floor(Math.random()*6)]
  }));

  (function glitterLoop() {
    gx.clearRect(0, 0, gc.width, gc.height);
    sparks.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      gx.beginPath();
      gx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      gx.fillStyle = s.c;
      gx.globalAlpha = Math.max(0, Math.min(1, s.a));
      gx.fill();
    });
    gx.globalAlpha = 1;
    requestAnimationFrame(glitterLoop);
  })();

  // ── Floating kiss emoji image ─────────────────────────────
  const fc = document.getElementById('floaties');
  const fx = fc.getContext('2d');

  gc.width  = fc.width  = window.innerWidth;
  gc.height = fc.height = window.innerHeight;

  const emojiImg = new Image();
  emojiImg.src = 'emoji.png';

  const floaties = Array.from({length: 25}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 45 + 25,
    vy: Math.random() * 0.7 + 0.25,
    vx: (Math.random() - 0.5) * 0.5,
    ang: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.012,
    a: Math.random() * 0.35 + 0.65
  }));

  (function floatLoop() {
    fx.clearRect(0, 0, fc.width, fc.height);
    if (emojiImg.complete && emojiImg.naturalWidth > 0) {
      floaties.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        p.ang += p.spin;
        if (p.y > fc.height + p.size) {
          p.y = -p.size;
          p.x = Math.random() * fc.width;
        }
        fx.save();
        fx.globalAlpha = p.a;
        fx.translate(p.x, p.y);
        fx.rotate(p.ang);
        fx.drawImage(emojiImg, -p.size / 2, -p.size / 2, p.size, p.size);
        fx.restore();
      });
    }
    requestAnimationFrame(floatLoop);
  })();

  window.addEventListener('resize', () => {
    gc.width  = fc.width  = window.innerWidth;
    gc.height = fc.height = window.innerHeight;
  });

  // ── Music ─────────────────────────────────────────────────
  let playing = false;
  const icon  = document.getElementById('music-icon');
  const label = document.getElementById('music-label');
  const yt    = document.getElementById('yt');
  const searchQuery = encodeURIComponent('#happybirthdaysidna redone ALLSTARS');

  function toggleMusic() {
    if (!playing) {
      yt.src = `https://www.youtube.com/embed/?listType=search&list=${searchQuery}&autoplay=1&controls=0&loop=1`;
      yt.style.display = 'block';
      icon.textContent  = '🔊';
      label.textContent = 'Vibing...';
      playing = true;
    } else {
      yt.src = '';
      icon.textContent  = '🔇';
      label.textContent = 'Play the vibe';
      playing = false;
    }
  }
</script>
</body>
</html>
